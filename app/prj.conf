# This file contains selected Kconfig options for the application.

CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SMF=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Enable bluetooth as BLE central, GATT client
CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y

# Enable BLE error number conversion to strings
CONFIG_BT_HCI_ERR_TO_STR=y


# Enable touchscreen display
CONFIG_DISPLAY=y

# Enable light versatile graphics library
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768

# Increase size of stack to support LVGL
CONFIG_MAIN_STACK_SIZE=4096
